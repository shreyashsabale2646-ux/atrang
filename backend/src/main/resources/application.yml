server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false
        name: ATRANG_SESSION_ID

spring:
  application:
    name: atrang-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atrang}
    username: ${SPRING_DATASOURCE_USERNAME:atrang_app}
    password: ${SPRING_DATASOURCE_PASSWORD:atrang_secret_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

atrang:
  admin:
    default-username: ${ATRANG_ADMIN_USERNAME:admin}
    default-password: ${ATRANG_ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${ATRANG_FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    in.ac.iiitt.atrang: INFO
    org.springframework.security: INFO
