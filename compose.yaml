# Atrang 2026–27 Full-Stack Docker Compose
# Run with: docker compose up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: atrang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atrang}
      POSTGRES_USER: ${POSTGRES_USER:-atrang_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrang_secret_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atrang_app} -d ${POSTGRES_DB:-atrang}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: atrang-backend:latest
    container_name: atrang-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atrang}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atrang_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atrang_secret_pass}
      ATRANG_ADMIN_USERNAME: ${ATRANG_ADMIN_USERNAME:-admin}
      ATRANG_ADMIN_PASSWORD: ${ATRANG_ADMIN_PASSWORD:-admin123}
      ATRANG_FRONTEND_ORIGIN: ${ATRANG_FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"

  atrang:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    image: atrang:latest
    container_name: atrang-frontend
    restart: unless-stopped
    ports:
      - "${ATRANG_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - backend

volumes:
  postgres_data:
